<body><header class="masthead"><a class="brand" href="#all" aria-label="文献库首页"><span class="mark" aria-hidden="true">文</span><span>具身智能 · 技术文献</span></a><a class="notes" href="https://my.feishu.cn/wiki/SM5zwUhCriOS0ykeF3KcRiNGnoc" target="_blank" rel="noopener">技术学习笔记 ↗</a></header>
<main><section class="intro"><p class="eyebrow">LITERATURE COLLECTION</p><h1>从关键技术，找到相关文献。</h1><p class="lead">围绕八个主题整理的论文与技术资料。可按主题浏览，也可跨主题检索。</p><div class="overview" id="overview" aria-live="polite">正在加载文献…</div></section>
<section class="workspace" aria-label="文献检索"><nav class="topics" id="topics" aria-label="技术主题"></nav><div class="searchbar"><label class="search"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="搜索论文题名、简称、作者或关键词" aria-label="搜索文献"><kbd>/</kbd></label><button id="reset" class="quiet" type="button">重置</button></div><div class="filters"><label>阅读范围<select id="scope"><option value="all">全部文献</option><option value="selected">正文代表性工作</option><option value="expanded">正文已展开实例</option></select></label><label>年份<select id="year"><option value="all">全部年份</option></select></label><label>资料类型<select id="kind"><option value="all">全部类型</option><option value="paper">研究论文</option><option value="survey">综述</option><option value="other">提案与技术资料</option></select></label><label>原文存档<select id="archive"><option value="all">全部</option><option value="yes">已保存原文</option><option value="no">原文待补</option></select></label><label class="sort">排序<select id="sort"><option value="new">年份由新到旧</option><option value="old">年份由旧到新</option><option value="title">按题名排序</option></select></label></div>
<div class="results-meta"><div><h2 id="result-title">全部文献</h2><span id="result-count" aria-live="polite"></span></div><p id="topic-note"></p></div><div id="results" class="results" aria-live="polite"></div><nav id="pagination" class="pagination" aria-label="结果分页"></nav></section>
<footer><p>收录范围来自已整理的综述、课程与专题材料。文献按主题关联，同一工作可属于多个主题。</p><p>原文存档保留所用版本；论文与相关资料的版权归原作者或出版方所有。<span id="update"></span></p></footer></main></body></html>
